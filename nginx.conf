server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — keep small, fast TTFB
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — let React Router own the routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache for hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No-cache for the entry HTML so deploys land instantly
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy:
    # - default-src 'self': nur eigene Origin
    # - script-src 'self' + Sentry browser-cdn (falls Sentry SDK von dort lädt)
    # - style-src 'self' 'unsafe-inline': Tailwind-Runtime-Styles + Radix-UI inline-styles
    # - connect-src: API-Backend + Sentry-Ingest
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://browser.sentry-cdn.com https://js.sentry-cdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://autoteile-bot-service-production.up.railway.app https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # HSTS — Cloudflare ist HTTPS-only. preload sollte später aktiviert werden
    # (erfordert manuelle Submission auf hstspreload.org).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Disable server-version disclosure
    server_tokens off;
}
