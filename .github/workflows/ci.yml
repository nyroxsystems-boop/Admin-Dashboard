name: Admin Dashboard CI

on:
  push:
    branches: [main, 'release/internal-platforms-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-dashboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run -- --maxWorkers=2
        env:
          VITE_API_BASE_URL: http://localhost:3000
          VITE_SCRAPER_BASE_URL: http://localhost:3001

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.partsunion.de
          VITE_SCRAPER_BASE_URL: https://api.partsunion.de

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
